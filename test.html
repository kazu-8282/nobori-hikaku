<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>調査ページ</title>
<style>
body{margin:0;background:#111;color:#eee;font:13px -apple-system,system-ui,sans-serif;
  padding:calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 8px)}
a,button{color:#fff;background:#e8590c;border:0;border-radius:8px;padding:10px 14px;font:inherit;text-decoration:none;display:inline-block}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.tile b{display:block;font-size:12px;line-height:1.3;min-height:3.9em}
.tile small{display:block;color:#3f3;font:10px monospace;min-height:2.6em;word-break:break-all}
.w{position:relative;height:150px;background:#000;border-radius:8px;overflow:hidden;outline:1px solid #555}
.w video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:0 0}
.plain{height:150px;outline:1px solid #555}
.plain video,.plain canvas{width:100%;height:150px;display:block}
</style>
</head>
<body>
<a href="./">← アプリに戻る</a>
<button id="again">もう一度</button>
<p id="msg">調査中… 30秒ほど待ってください。</p>
<div id="grid"></div>
<script>
'use strict';
const wait = ms => new Promise(r => setTimeout(r, ms));
const once = (el, name, ms = 3000) => new Promise(r => {
  const t = setTimeout(() => r('timeout'), ms);
  el.addEventListener(name, () => { clearTimeout(t); r('ok'); }, { once: true });
});

function firstBlob() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('climb-compare');
    r.onerror = () => rej(r.error);
    r.onsuccess = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('blobs')) { d.close(); res(null); return; }
      const c = d.transaction('blobs').objectStore('blobs').openCursor();
      c.onsuccess = () => { res(c.result ? c.result.value : null); d.close(); };
      c.onerror = () => rej(c.error);
    };
  });
}

function tile(no, title, plain) {
  const el = document.createElement('div');
  el.className = 'tile';
  el.innerHTML = `<b></b><div class="${plain ? 'plain' : 'w'}"></div><small></small>`;
  el.querySelector('b').textContent = `${no} ${title}`;
  document.getElementById('grid').append(el);
  return { box: el.querySelector('div'), note: el.querySelector('small') };
}
function video(t, blob) {
  const v = document.createElement('video');
  v.muted = true; v.playsInline = true; v.preload = 'auto';
  v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
  t.box.append(v);
  const show = () => { t.note.textContent = `t${v.currentTime.toFixed(2)} ${v.paused ? 'pause' : 'PLAY'}${v.seeking ? ' SEEKING' : ''} rs${v.readyState} ${t.extra || ''}`; };
  setInterval(show, 300);
  v.src = URL.createObjectURL(blob);
  return v;
}
async function playFor(v, ms) {
  try { await v.play(); } catch (e) { return 'play拒否'; }
  await wait(ms);
  v.pause();
  return 'ok';
}
async function seek(v, t) {
  const done = once(v, 'seeked');
  v.currentTime = t;
  return done;
}

async function run() {
  document.getElementById('grid').replaceChildren();
  const msg = document.getElementById('msg');
  msg.textContent = '調査中… 30秒ほど待ってください。';
  const blob = await firstBlob();
  if (!blob) { msg.textContent = 'アプリに保存された動画がありません。先にアプリで動画を1本入れてください。'; return; }

  let t, v;
  t = tile(1, '読み込むだけ');
  v = video(t, blob); await once(v, 'loadedmetadata'); await wait(800);

  t = tile(2, '0.001秒へ移動');
  v = video(t, blob); await once(v, 'loadedmetadata'); t.extra = await seek(v, 0.001); await wait(500);

  t = tile(3, '0.5秒再生して止める');
  v = video(t, blob); await once(v, 'loadedmetadata'); t.extra = await playFor(v, 500); await wait(500);

  t = tile(4, '再生→止める→2秒へ移動');
  v = video(t, blob); await once(v, 'loadedmetadata'); await playFor(v, 500); t.extra = await seek(v, 2); await wait(500);
  const v4 = v;

  t = tile(5, '4のあと一瞬だけ再生');
  v = video(t, blob); await once(v, 'loadedmetadata'); await playFor(v, 500); await seek(v, 2); t.extra = await playFor(v, 120); await wait(500);

  t = tile(6, '動画をメモリに読み直して4');
  v = video(t, new Blob([await blob.arrayBuffer()], { type: blob.type })); await once(v, 'loadedmetadata'); await playFor(v, 500); t.extra = await seek(v, 2); await wait(500);

  t = tile(7, '4の絵を別の板に写す', true);
  const c = document.createElement('canvas');
  c.width = 180; c.height = 320;
  t.box.append(c);
  try { c.getContext('2d').drawImage(v4, 0, 0, 180, 320); t.note.textContent = '写した'; } catch (e) { t.note.textContent = '失敗 ' + e.name; }

  t = tile(8, '飾りなしで4', true);
  v = video(t, blob); await once(v, 'loadedmetadata'); await playFor(v, 500); t.extra = await seek(v, 2); await wait(500);

  t = tile(9, '3コマだけ再生→止める→2秒へ');
  v = video(t, blob); await once(v, 'loadedmetadata');
  try {
    await v.play();
    if (v.requestVideoFrameCallback) await new Promise(r => { let n = 0; const f = () => (++n >= 3 ? r() : v.requestVideoFrameCallback(f)); v.requestVideoFrameCallback(f); setTimeout(r, 1500); });
    v.pause();
  } catch (e) {}
  t.extra = await seek(v, 2); await wait(500);

  t = tile(10, '再生→止める→0.05秒へ');
  v = video(t, blob); await once(v, 'loadedmetadata'); await playFor(v, 500); t.extra = await seek(v, 0.05); await wait(500);

  t = tile(11, '再生→止める→0.3秒へ');
  v = video(t, blob); await once(v, 'loadedmetadata'); await playFor(v, 500); t.extra = await seek(v, 0.3); await wait(500);

  t = tile(12, '再生→止める→続けて20回移動');
  v = video(t, blob); await once(v, 'loadedmetadata'); await playFor(v, 500);
  { let ok = 0; const t0 = performance.now(); for (let i = 0; i < 20; i++) if (await seek(v, 2 + i * 0.05) === 'ok') ok++; t.extra = `${ok}/20回 ${Math.round(performance.now() - t0)}ms`; }
  await wait(500);

  t = tile(13, '絵の枚数を数え続けながら4');
  v = video(t, blob);
  if (v.requestVideoFrameCallback) { let n = 0; const vv = v, tt = t; (function count() { vv.requestVideoFrameCallback(() => { n++; tt.count = n; count(); }); })(); }
  await once(v, 'loadedmetadata'); await playFor(v, 500); await seek(v, 2); await wait(800); t.extra = `数えた枚数${t.count || 0}`;

  msg.textContent = `終わりました。この画面のスクリーンショットを送ってください。（動画 ${(blob.size / 1048576).toFixed(0)}MB ${blob.type}）`;
}
document.getElementById('again').onclick = run;
run().catch(e => { document.getElementById('msg').textContent = 'エラー: ' + e; });
</script>
</body>
</html>
