<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="登り比較">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>登り比較</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#111;color:#eee;font:15px -apple-system,system-ui,sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
[hidden]{display:none!important}
button{font:inherit;color:#eee;background:#2a2a2e;border:0;border-radius:8px;padding:0 12px;min-height:44px}
button:active{background:#444}
input{font:inherit;font-size:16px;color:#eee;background:#2a2a2e;border:1px solid #444;border-radius:8px;
  padding:10px;width:100%;-webkit-user-select:text;user-select:text}

#hint{display:flex;gap:8px;align-items:center;padding:8px;background:#5c2b00;font-size:13px;line-height:1.5}
#hint span{flex:1}

#stage{flex:1;min-height:0;position:relative;display:grid;grid-template:"a" 1fr "m" auto "b" 1fr / 1fr}
.pane[data-side="A"]{grid-area:a}
.pane[data-side="B"]{grid-area:b}
#mid{grid-area:m}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column;gap:4px;padding:4px}
.ctl{display:flex;flex-direction:column;gap:4px}
.vwrap{flex:1;min-height:0;position:relative;background:#000;border-radius:8px;overflow:hidden;touch-action:none;-webkit-touch-callout:none}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:0 0}
.label,.time{position:absolute;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.6);font-size:12px;pointer-events:none}
.label{left:6px;top:6px;max-width:calc(100% - 12px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{right:6px;bottom:6px;font-variant-numeric:tabular-nums}
.dbg{position:absolute;left:4px;right:64px;bottom:4px;font:10px/1.3 monospace;color:#3f3;background:rgba(0,0,0,.7);pointer-events:none;white-space:pre-wrap;word-break:break-all}
.empty{position:absolute;inset:0;margin:auto;width:max-content;height:48px;background:#e8590c;color:#fff;font-weight:600}
.pane.has .empty{display:none}
.pane:not(.has) .time{display:none}
.seek{width:100%;height:28px;margin:0;accent-color:#e8590c}
.row{display:flex;gap:4px}
.row button{flex:1;padding:0;font-size:14px}
.row .on{background:#e8590c;color:#fff}

#mid{display:flex;gap:4px;padding:0 4px}
#setsBtn{flex:none;padding:0 16px}
#both{flex:1;display:flex;gap:8px;align-items:center;justify-content:center;background:#e8590c;color:#fff;font-weight:600}
#both:active{background:#b94608}
@media (orientation:landscape){
  #stage{grid-template:"a m b" 1fr / 1fr 56px 1fr}
  #mid{flex-direction:column;padding:4px 0}
  #setsBtn{padding:0;font-size:12px}
  #both{flex-direction:column;padding:0}
}
/* 縦長の動画のとき：2本を隣り合わせにして大きく映す */
body.tall #stage{grid-template:"a b" 1fr "m m" auto / 1fr 1fr}
body.tall .row{flex-wrap:wrap}
body.tall .row button{flex:1 0 30%}
@media (orientation:landscape){
  body.tall #stage{grid-template:"a b" 1fr / 1fr 1fr}
  body.tall{padding-bottom:0}
  body.tall .pane{flex-direction:row;gap:2px;padding:0 2px}
  body.tall .vwrap{border-radius:0}
  body.tall .ctl{width:104px;justify-content:center}
  body.tall .row button{min-height:36px;font-size:12px}
  body.tall .pane[data-side="A"] .ctl{order:-1}
  body.tall #mid{position:absolute;z-index:2;left:50%;bottom:calc(env(safe-area-inset-bottom) + 4px);transform:translateX(-50%);width:56px;padding:0;flex-direction:column-reverse;align-items:center;gap:6px}
  body.tall #both{flex:none;width:56px;height:56px;border-radius:50%;gap:0;font-size:11px;opacity:.9}
  body.tall #setsBtn{width:44px;height:44px;min-height:0;border-radius:50%;font-size:10px;opacity:.9}
}

#lib,#sets{position:fixed;inset:0;z-index:10;background:#111;overflow:auto;display:flex;flex-direction:column;gap:8px;
  padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 8px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 8px)}
#lib header,#sets header{display:flex;align-items:center;gap:8px}
#lib header b,#sets header b{flex:1;font-size:17px}
#add,#setSave{background:#e8590c;color:#fff;font-weight:600}
#list,#setList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
#list li,#setList li{display:flex;gap:4px}
.pick{flex:1;min-width:0;text-align:left;padding:8px 12px;line-height:1.4}
.pick small{display:block;color:#aaa}
.del{color:#ff8a80}
#usage{color:#aaa;font-size:13px;text-align:center;padding:8px}

#edit{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px}
#edit .card{background:#1c1c1f;border-radius:12px;padding:16px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
#edit label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#aaa}
#edit .btns{display:flex;gap:8px}
#edit .btns button{flex:1}
#eSave{background:#e8590c;color:#fff;font-weight:600}
</style>
</head>
<body>

<div id="hint" hidden>
  <span>保存した動画が消えないように、下の共有ボタンから「ホーム画面に追加」して、そのアイコンから開いてください。</span>
  <button id="hintClose">閉じる</button>
</div>

<main id="stage">
  <section class="pane" data-side="A"></section>
  <div id="mid"><button id="both"><span id="bothIco">▶</span><span>両方</span></button><button id="setsBtn">セット</button></div>
  <section class="pane" data-side="B"></section>
</main>

<div id="lib" hidden>
  <header><b id="libTitle"></b><button id="libClose">閉じる</button></header>
  <button id="add">＋ カメラロールから追加</button>
  <ul id="list"></ul>
  <div id="usage"></div>
</div>

<div id="sets" hidden>
  <header><b>セット（A と B の組み合わせ）</b><button id="setsClose">閉じる</button></header>
  <button id="setSave">＋ いまの A と B を名前を付けて保存</button>
  <ul id="setList"></ul>
  <div style="color:#777;font-size:12px;text-align:center">版 13　<a href="test.html" style="color:#6cf">調査ページを開く</a></div>
</div>

<form id="edit" hidden>
  <div class="card">
    <label>撮った日<input type="date" id="eDate" required></label>
    <label>メモ（課題名など）<input type="text" id="eMemo" maxlength="40" placeholder="例：3級 赤"></label>
    <div class="btns">
      <button type="button" id="eCancel">やめる</button>
      <button type="submit" id="eSave">保存</button>
    </div>
  </div>
</form>

<input type="file" id="file" accept="video/*" hidden>

<template id="paneTpl">
  <div class="vwrap">
    <video playsinline muted preload="auto"></video>
    <div class="label"></div>
    <div class="time"></div>
    <div class="dbg"></div>
    <button class="empty">＋ 動画を選ぶ</button>
  </div>
  <div class="ctl">
  <input type="range" class="seek" min="0" max="0" step="0.01" value="0" aria-label="再生位置">
  <div class="row">
    <button class="back" aria-label="1コマ戻す">◀|</button>
    <button class="play" aria-label="再生・停止">▶</button>
    <button class="fwd" aria-label="1コマ進める">|▶</button>
    <button class="rate" data-r="0.25">0.25x</button>
    <button class="rate" data-r="0.5">0.5x</button>
    <button class="rate on" data-r="1">1x</button>
    <button class="swap">替える</button>
  </div>
  </div>
</template>

<script>
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const FRAME = 1 / 30; // コマ送りの1コマ（秒）
// 位置を動かすときの下限（秒）。iPhoneでは、0秒ちょうどや0.001秒へ動かすと
// 移動が終わらないまま固まり、画面が真っ暗になった（実機の状態表示で確認）。
const MIN_T = 0.05;

// ---------- 保存（IndexedDB：meta=一覧用の情報、blobs=動画本体） ----------
let dbPromise;
function db() {
  return dbPromise ??= new Promise((res, rej) => {
    const r = indexedDB.open('climb-compare', 2);
    r.onupgradeneeded = () => {
      const d = r.result;
      for (const [name, opt] of [['meta', { keyPath: 'id' }], ['blobs'], ['sets', { keyPath: 'id' }]])
        if (!d.objectStoreNames.contains(name)) d.createObjectStore(name, opt);
    };
    r.onsuccess = () => { r.result.onversionchange = () => r.result.close(); res(r.result); };
    r.onerror = () => rej(r.error);
  });
}
async function tx(stores, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction(stores, mode);
    let out;
    t.oncomplete = () => res(out);
    t.onerror = t.onabort = () => rej(t.error);
    const r = fn(t);
    if (r) r.onsuccess = () => { out = r.result; };
  });
}
const listMeta = () => tx(['meta'], 'readonly', t => t.objectStore('meta').getAll());
const getBlob = id => tx(['blobs'], 'readonly', t => t.objectStore('blobs').get(id));
const putMeta = meta => tx(['meta'], 'readwrite', t => { t.objectStore('meta').put(meta); });
const addVideo = (meta, blob) => tx(['meta', 'blobs'], 'readwrite', t => {
  t.objectStore('meta').put(meta);
  t.objectStore('blobs').put(blob, meta.id);
});
const delVideo = id => tx(['meta', 'blobs'], 'readwrite', t => {
  t.objectStore('meta').delete(id);
  t.objectStore('blobs').delete(id);
});

const listSets = () => tx(['sets'], 'readonly', t => t.objectStore('sets').getAll());
const putSet = set => tx(['sets'], 'readwrite', t => { t.objectStore('sets').put(set); });
const delSet = id => tx(['sets'], 'readwrite', t => { t.objectStore('sets').delete(id); });
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2);

function remember(key, value) { try { localStorage.setItem(key, value); } catch {} }
function recall(key) { try { return localStorage.getItem(key); } catch { return null; } }

// ---------- 表示用 ----------
const titleOf = m => `${m.date.replaceAll('-', '/')} ${m.memo}`.trim();
function localDate(ms) {
  const d = new Date(ms), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function clock(s) {
  s = Math.max(0, s || 0);
  return `${Math.floor(s / 60)}:${(s % 60).toFixed(2).padStart(5, '0')}`;
}

// ---------- 左右（上下）の動画 ----------
const panes = {};
for (const el of document.querySelectorAll('.pane')) {
  el.append($('#paneTpl').content.cloneNode(true));
  const p = {
    el, side: el.dataset.side, v: $('video', el), seek: $('.seek', el),
    label: $('.label', el), time: $('.time', el), playBtn: $('.play', el),
    rate: 1, id: null, url: null, dragging: false,
  };
  panes[p.side] = p;
  p.label.textContent = p.side;

  // ---- 調査用（原因が分かったら消す）：動画の状態と、直近の出来事を画面に出す
  p.dbg = $('.dbg', el);
  p.log = [];
  for (const name of ['loadstart', 'loadedmetadata', 'canplay', 'waiting', 'stalled', 'suspend', 'emptied', 'abort', 'error', 'seeking', 'seeked', 'play', 'pause', 'ended'])
    p.v.addEventListener(name, () => { p.log.push(name); if (p.log.length > 10) p.log.shift(); });

  p.playBtn.onclick = () => togglePlay(p);
  gestures(p);
  p.v.onseeked = () => seekDone(p);
  $('.back', el).onclick = () => step(p, -1);
  $('.fwd', el).onclick = () => step(p, 1);
  $('.swap', el).onclick = $('.empty', el).onclick = () => openLib(p.side);
  for (const b of el.querySelectorAll('.rate')) b.onclick = () => setRate(p, +b.dataset.r);

  p.seek.oninput = () => { p.v.currentTime = clamp(+p.seek.value, MIN_T, lastFrame(p)); };
  p.seek.onpointerdown = () => { p.dragging = true; };
  p.seek.onpointerup = p.seek.onpointercancel = () => { p.dragging = false; };

  p.v.onloadedmetadata = () => {
    p.seek.max = p.v.duration;
    const at = Math.max(p.startAt, MIN_T);
    p.startAt = 0;
    prime(p, at);
    refreshLayout();
  };
  p.v.onplay = p.v.onpause = refreshButtons;
  p.v.onerror = () => { if (p.id) p.label.textContent = `${p.side} この動画は再生できません`; };
}

const togglePlay = p => (p.v.paused ? play(p) : p.v.pause());
const clamp = (x, lo, hi) => Math.min(Math.max(x, lo), hi);
// 動画のいちばん最後ぴったりに合わせるとiPhoneでは真っ暗になるので、少し手前までにする
const lastFrame = p => Math.max((p.v.duration || 0) - 0.05, 0);
// 読み込んだ動画を、止めたまま位置を動かせる状態にする。
// iPhoneは、実際に絵が何コマか出るまで再生しないと、止めたあとの画面が真っ暗になる
// （再生してすぐ止めただけでは真っ暗のままだった）。なので絵が3コマ出るのを待ってから止め、
// そのあとで見せたい位置へ動かす。
function prime(p, at) {
  const v = p.v, url = p.url;
  let done = false;
  const finish = () => {
    if (done || p.url !== url) return;
    done = true;
    v.pause();
    v.currentTime = at;
  };
  v.play().then(() => {
    if (v.requestVideoFrameCallback) {
      let frames = 0;
      const onFrame = () => { if (++frames >= 3) finish(); else if (!done) v.requestVideoFrameCallback(onFrame); };
      v.requestVideoFrameCallback(onFrame);
      setTimeout(finish, 1500);
    } else setTimeout(finish, 400);
  }, finish);
}

// 指でなぞっている間、動画の位置を指の位置（p.scrub.target）へ動かす。毎コマ呼ばれる。
// 前の移動が終わってから次を送る。
function chase(p) {
  if (p.busy || Math.abs(p.scrub.target - p.v.currentTime) <= 0.02) return;
  if (!p.v.paused) p.v.pause();
  p.busy = true;
  p.v.currentTime = p.scrub.target;
  p.seekTimer = setTimeout(() => seekDone(p), 1000); // 「終わった」の合図が来ないときの保険
}
function seekDone(p) {
  clearTimeout(p.seekTimer);
  p.busy = false;
}

// 動画の上での指の操作
//  1本指で左右になぞる：その分だけ動画を進める・戻す（指の速さでスロー再生）→ chase()
//  2本指でつまむ・広げる：その画面だけ拡大。2本指のまま動かすと見る場所を移せる
//  タップ：再生・停止　／　2回タップ：拡大を元に戻す
const SCRUB = 0.01; // 指1ピクセルで進む秒数
const MAX_ZOOM = 6;
function gestures(p) {
  const box = $('.vwrap', p.el);
  const pts = new Map();
  let g = null, lastTap = 0;
  p.zoom = { s: 1, x: 0, y: 0 };
  p.applyZoom = () => {
    const z = p.zoom, W = box.clientWidth, H = box.clientHeight;
    z.x = clamp(z.x, W - W * z.s, 0);
    z.y = clamp(z.y, H - H * z.s, 0);
    p.v.style.transform = z.s === 1 ? '' : `translate(${z.x}px,${z.y}px) scale(${z.s})`;
  };
  const local = e => {
    const r = box.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };
  const pinchNow = () => {
    const [a, b] = [...pts.values()];
    return { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
  };
  box.onpointerdown = e => {
    if (e.target.closest('button')) return;
    try { box.setPointerCapture(e.pointerId); } catch {}
    pts.set(e.pointerId, local(e));
    if (pts.size === 1) g = { one: true, x0: e.clientX, t0: p.v.currentTime, moved: false, at: performance.now() };
    else if (pts.size === 2) g = { ...pinchNow(), s0: p.zoom.s, zx: p.zoom.x, zy: p.zoom.y };
  };
  box.onpointermove = e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, local(e));
    if (!g) return;
    if (g.one) {
      const dx = e.clientX - g.x0;
      if (!p.id || (!g.moved && Math.abs(dx) < 8)) return;
      if (!g.moved) { g.moved = true; p.v.pause(); p.scrub = { target: g.t0 }; }
      p.scrub.target = clamp(g.t0 + dx * SCRUB, MIN_T, lastFrame(p));
    } else if (pts.size >= 2) {
      const now = pinchNow();
      const s = clamp(g.s0 * now.d / g.d, 1, MAX_ZOOM);
      // つまみ始めに指の真ん中にあった場所が、いまの指の真ん中に来るようにする
      p.zoom = { s, x: now.mx - (g.mx - g.zx) * (s / g.s0), y: now.my - (g.my - g.zy) * (s / g.s0) };
      p.applyZoom();
    }
  };
  box.onpointerup = box.onpointercancel = e => {
    if (!pts.delete(e.pointerId)) return;
    const now = performance.now();
    if (g?.one && !g.moved && e.type === 'pointerup' && now - g.at < 300) {
      if (now - lastTap < 350) { p.zoom = { s: 1, x: 0, y: 0 }; p.applyZoom(); }
      lastTap = now;
      togglePlay(p);
    }
    if (p.scrub) { p.scrub = null; p.v.pause(); p.v.playbackRate = p.rate; }
    g = null; // 指が残っていても、全部離すまでは何もしない
  };
}
addEventListener('resize', () => Object.values(panes).forEach(p => p.applyZoom()));

function play(p) {
  if (!p.id) return;
  if (p.v.duration - p.v.currentTime < 0.1) p.v.currentTime = MIN_T;
  p.v.playbackRate = p.rate;
  p.v.play().catch(() => {});
}
function step(p, dir) {
  if (!p.id) return;
  p.v.pause();
  p.v.currentTime = clamp(p.v.currentTime + dir * FRAME, MIN_T, lastFrame(p));
}
function setRate(p, r) {
  p.rate = r;
  p.v.defaultPlaybackRate = p.v.playbackRate = r;
  for (const b of p.el.querySelectorAll('.rate')) b.classList.toggle('on', +b.dataset.r === r);
}
async function loadSlot(p, id, startAt = 0) {
  p.v.pause();
  if (p.url) { URL.revokeObjectURL(p.url); p.url = null; }
  p.v.removeAttribute('src');
  p.v.load();
  p.id = null;
  p.zoom = { s: 1, x: 0, y: 0 };
  p.applyZoom();
  const meta = id && (await listMeta()).find(m => m.id === id);
  const blob = meta && await getBlob(id);
  if (blob) {
    p.id = id;
    p.url = URL.createObjectURL(blob);
    p.startAt = startAt;
    p.info = `${(blob.size / 1048576).toFixed(0)}MB ${blob.type || 'notype'}`;
    p.v.src = p.url;
    p.v.defaultPlaybackRate = p.rate;
  }
  p.label.textContent = blob ? `${p.side} ${titleOf(meta)}` : p.side;
  p.el.classList.toggle('has', !!p.id);
  remember('slot-' + p.side, p.id || '');
  refreshButtons();
  refreshLayout();
}
// 縦長の動画が1本でもあれば（まだ何もなければ縦長とみなして）隣り合わせの並びにする
function refreshLayout() {
  const sized = Object.values(panes).filter(p => p.id && p.v.videoWidth);
  document.body.classList.toggle('tall', !sized.length || sized.some(p => p.v.videoHeight > p.v.videoWidth));
}

const loaded = () => Object.values(panes).filter(p => p.id);
const anyPlaying = () => loaded().some(p => !p.v.paused);
$('#both').onclick = () => {
  if (anyPlaying()) loaded().forEach(p => p.v.pause());
  else loaded().forEach(play);
};
function refreshButtons() {
  for (const p of Object.values(panes)) p.playBtn.textContent = p.v.paused ? '▶' : '⏸';
  $('#bothIco').textContent = anyPlaying() ? '⏸' : '▶';
}
(function tick() {
  for (const p of loaded()) {
    if (p.scrub) chase(p);
    const v = p.v, buf = [];
    for (let i = 0; i < v.buffered.length; i++) buf.push(`${v.buffered.start(i).toFixed(1)}-${v.buffered.end(i).toFixed(1)}`);
    p.dbg.textContent = `v12 rs${v.readyState} ns${v.networkState} ${v.paused ? 'pause' : 'PLAY'}${v.seeking ? ' SEEKING' : ''} err${v.error ? v.error.code : '-'}`
      + `
t${v.currentTime.toFixed(2)}/${(v.duration || 0).toFixed(1)} x${v.playbackRate} ${v.videoWidth}x${v.videoHeight} ${p.info || ''}`
      + `
buf ${buf.join(',') || 'none'}
${p.log.join(' ')}`;
    if (!p.dragging) p.seek.value = p.v.currentTime;
    p.time.textContent = clock(p.v.currentTime);
  }
  requestAnimationFrame(tick);
})();

// ---------- 保存した動画の一覧 ----------
let libSide = 'A';
let editing = null; // { file } 新しく追加 / { meta } メモの直し

async function openLib(side) {
  libSide = side;
  $('#libTitle').textContent = `${side} に出す動画を選ぶ`;
  await renderList();
  $('#lib').hidden = false;
}
$('#libClose').onclick = () => { $('#lib').hidden = true; };

async function renderList() {
  const metas = (await listMeta()).sort((a, b) => b.date.localeCompare(a.date) || b.addedAt - a.addedAt);
  const list = $('#list');
  list.replaceChildren();
  for (const m of metas) {
    const li = document.createElement('li');
    const pick = document.createElement('button');
    pick.className = 'pick';
    const inUse = Object.values(panes).filter(p => p.id === m.id).map(p => p.side).join('・');
    const small = document.createElement('small');
    small.textContent = `${(m.size / 1048576).toFixed(0)} MB${inUse ? `　いま ${inUse} に表示中` : ''}`;
    pick.append(titleOf(m), small);
    pick.onclick = async () => { await loadSlot(panes[libSide], m.id); $('#lib').hidden = true; };

    const edit = document.createElement('button');
    edit.textContent = 'メモ';
    edit.onclick = () => openEdit({ meta: m });

    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '削除';
    del.onclick = async () => {
      if (!confirm(`「${titleOf(m)}」をアプリから削除します。元に戻せません。\n（カメラロールの動画は消えません）`)) return;
      await delVideo(m.id);
      for (const p of Object.values(panes)) if (p.id === m.id) await loadSlot(p, null);
      renderList();
    };
    li.append(pick, edit, del);
    list.append(li);
  }
  const total = metas.reduce((s, m) => s + m.size, 0);
  $('#usage').textContent = metas.length
    ? `${metas.length}本を保存中（合計 約${(total / 1048576).toFixed(0)} MB）`
    : 'まだ動画がありません。上のボタンから追加してください。';
}

$('#add').onclick = () => $('#file').click();
$('#file').onchange = e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (file) openEdit({ file });
};

function openEdit(target) {
  editing = target;
  $('#eDate').value = target.meta ? target.meta.date : localDate(target.file.lastModified || Date.now());
  $('#eMemo').value = target.meta ? target.meta.memo : '';
  $('#eSave').textContent = '保存';
  $('#eSave').disabled = false;
  $('#edit').hidden = false;
}
$('#eCancel').onclick = () => { editing = null; $('#edit').hidden = true; };
$('#edit').onsubmit = async e => {
  e.preventDefault();
  const date = $('#eDate').value, memo = $('#eMemo').value.trim();
  $('#eSave').disabled = true;
  $('#eSave').textContent = '保存中…';
  try {
    if (editing.file) {
      const meta = {
        id: newId(),
        date, memo, size: editing.file.size, addedAt: Date.now(),
      };
      await addVideo(meta, editing.file);
      await loadSlot(panes[libSide], meta.id);
      $('#lib').hidden = true;
    } else {
      const meta = { ...editing.meta, date, memo };
      await putMeta(meta);
      for (const p of Object.values(panes)) if (p.id === meta.id) p.label.textContent = `${p.side} ${titleOf(meta)}`;
      await renderList();
    }
    editing = null;
    $('#edit').hidden = true;
  } catch (err) {
    console.error(err);
    alert('保存できませんでした。iPhoneの空き容量が足りないかもしれません。');
    $('#eSave').disabled = false;
    $('#eSave').textContent = '保存';
  }
};

// ---------- セット（A と B の組み合わせを名前を付けて保存） ----------
$('#setsBtn').onclick = async () => { await renderSets(); $('#sets').hidden = false; };
$('#setsClose').onclick = () => { $('#sets').hidden = true; };
$('#setSave').onclick = async () => {
  const { A, B } = panes;
  if (!A.id || !B.id) { alert('A と B の両方に動画を出してから保存してください。'); return; }
  const name = prompt('このセットの名前（例：3級 赤 落ちた日と登れた日）')?.trim();
  if (!name) return;
  // 動画の組み合わせと、いま止めている位置を覚える
  await putSet({ id: newId(), name, a: A.id, b: B.id, ta: A.v.currentTime, tb: B.v.currentTime, addedAt: Date.now() });
  renderSets();
};
async function renderSets() {
  const [sets, metas] = await Promise.all([listSets(), listMeta()]);
  const title = id => { const m = metas.find(m => m.id === id); return m ? titleOf(m) : '（削除された動画）'; };
  const list = $('#setList');
  list.replaceChildren();
  for (const s of sets.sort((x, y) => y.addedAt - x.addedAt)) {
    const li = document.createElement('li');
    const pick = document.createElement('button');
    pick.className = 'pick';
    const a = document.createElement('small'), b = document.createElement('small');
    a.textContent = `A：${title(s.a)}`;
    b.textContent = `B：${title(s.b)}`;
    pick.append(s.name, a, b);
    pick.onclick = async () => {
      await Promise.all([loadSlot(panes.A, s.a, s.ta), loadSlot(panes.B, s.b, s.tb)]);
      $('#sets').hidden = true;
    };
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '削除';
    del.onclick = async () => {
      if (!confirm(`セット「${s.name}」を削除します。\n（動画そのものは消えません）`)) return;
      await delSet(s.id);
      renderSets();
    };
    li.append(pick, del);
    list.append(li);
  }
  if (!sets.length) {
    const li = document.createElement('li');
    li.style.cssText = 'color:#aaa;font-size:13px;justify-content:center;padding:8px';
    li.textContent = 'まだセットがありません。';
    list.append(li);
  }
}

// ---------- 起動 ----------
const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
if (!standalone && /iPhone|iPad|iPod/.test(navigator.userAgent)) $('#hint').hidden = false;
$('#hintClose').onclick = () => { $('#hint').hidden = true; };
navigator.storage?.persist?.().catch(() => {});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
for (const p of Object.values(panes)) loadSlot(p, recall('slot-' + p.side)).catch(console.error);
</script>
</body>
